spring.application.name=event-api

# Separate in-memory database from the Order (semanticdb) and Library (librarydb) APIs. Experiments override this
# with a file database per run (SPRING_DATASOURCE_URL).
spring.datasource.url=jdbc:h2:mem:eventsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Order API 8080, Library API 8081.
server.port=8082

springdoc.default-produces-media-type=application/json
