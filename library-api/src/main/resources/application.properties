spring.application.name=library-api

# Separate in-memory database from the Order API (jdbc:h2:mem:semanticdb). Experiments override this with a
# file database per run (SPRING_DATASOURCE_URL) so the semantic validator can read it.
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# The Order API uses 8080; both can run at the same time.
server.port=8081

springdoc.default-produces-media-type=application/json
